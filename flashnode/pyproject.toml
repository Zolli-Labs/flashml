[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashnode"
# 0.3.0 lends a host directory to tasks by label (FLASHNODE_LOCAL_DATA), which
# needs flashruntime 0.4's NodeRegistration.local_datasets to advertise what
# this host can serve. (0.2.0 was the first published release; 0.2.1 fixed a
# hardcoded __version__ that made every agent register as 0.1.0.) Released from
# the Zolli-Labs/flashml monorepo by pushing a `flashnode-vX.Y.Z` tag, and only
# AFTER the flashruntime floor below is on PyPI.
# 0.3.3 reports execution evidence at commit time (wall clock, mean CPU/GPU
# utilisation, the digest of the image that ran, exit code). It needs
# flashruntime 0.4.2's ExecutionEvidence — see the floor below. Bumped even
# though nothing breaks: an agent whose wire behaviour differs must not share
# a version string with one that predates it.
# 0.3.4 adds `--runner trusted` (TrustedArgvRunner): unsandboxed argv
# execution, opt-in only, for hosts that cannot run Docker (Colab, provider
# pods) inside a team pool whose members trust each other. `discover()` now
# passes `unsandboxed_argv_capable` to NodeRegistration — see the floor
# below for why that moves the pin in this commit, not just at tag time.
version = "0.3.4"
description = "Open host agent for the FlashML fragmented-compute network: join, benchmark, execute sandboxed ML tasks, earn contribution credits."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    # The floor is where the wire fields this agent emits actually exist.
    # Originally >=0.2, because 0.1.0 predates NodeRegistration.module_capable:
    # a volunteer on that wheel would register without the field, and the
    # coordinator's fail-open module gate happens to tolerate that, but
    # argv_capable's fail-closed gate does not.
    #
    # Raised to >=0.4,<0.5: this agent advertises local_datasets, which only
    # exists from flashruntime 0.4. On 0.3 pydantic silently ignores the extra
    # kwarg, so the host would advertise nothing and the coordinator's gate
    # would simply never place local-data work on it — fail-closed, but
    # INVISIBLY, which is the worst way for a floor to be wrong. The upper
    # bound is deliberate: this agent runs on machines we cannot reach, so it
    # must never be silently upgraded across a protocol-breaking release.
    #
    # Raised again to >=0.4.1 for the GPU probe. This one is unlike every
    # floor above it: `inventory/capabilities.py` imports GpuInfo from
    # flashruntime.protocol at MODULE scope, and GpuInfo does not exist in the
    # published 0.4.0 wheel. There is no silent degradation to reason about —
    # the agent raises ImportError and never registers at all. The release
    # workflow's `resolvable` job runs `flashnode --help` against PyPI alone
    # precisely to catch this, so a wrong floor here fails the release rather
    # than a volunteer's machine.
    # Raised again to >=0.4.2 for execution evidence, and for exactly the same
    # import-time reason as the GPU probe above: `executor/client.py` and
    # `executor/loop.py` import ExecutionEvidence at MODULE scope, and it does
    # not exist in the published 0.4.1 wheel. The agent raises ImportError and
    # never registers at all. The release workflow's `resolvable` job runs
    # `flashnode --help` against PyPI alone precisely to catch this.
    # Raised again to >=0.4.3 for `--runner trusted`: `discover()` now passes
    # `unsandboxed_argv_capable` to NodeRegistration, a field 0.4.2's model
    # does not declare. Unlike the two floors above, this is not an
    # import-time ImportError — it is pydantic refusing an unknown kwarg at
    # CALL time, inside `flashnode work`, on every runner tier, not just
    # trusted. Same import-time-hard-failure shape as 0.3.2/0.3.3 in effect
    # (the agent never registers), so the floor moves in this commit, not at
    # tag time.
    "flashruntime>=0.4.3,<0.5",
    "psutil>=5.9",
    "websockets>=12",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
flashnode = "flashnode.agent.cli:main"

[project.urls]
Homepage = "https://github.com/Zolli-Labs/flashnode"

[tool.setuptools.packages.find]
include = ["flashnode*"]

[tool.pytest.ini_options]
# Unit tests run everywhere with zero infrastructure. Integration tests
# (tests/integration/) need a real Docker daemon and are opt-in:
# pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: needs a real docker daemon; excluded by default, run with -m integration",
]
