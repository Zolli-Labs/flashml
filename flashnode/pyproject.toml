[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashnode"
# 0.2.0 was the first published release; 0.1.0 never reached PyPI. 0.2.1 fixes
# a hardcoded __version__ in flashnode/__init__.py that 0.2.0 shipped as
# "0.1.0" — so every agent registered with the coordinator under the wrong
# agent_version. Released from the Zolli-Labs/flashml monorepo by pushing a
# `flashnode-vX.Y.Z` tag, and only AFTER the flashruntime floor below is on PyPI.
version = "0.2.1"
description = "Open host agent for the FlashML fragmented-compute network: join, benchmark, execute sandboxed ML tasks, earn contribution credits."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    # The floor is where the wire fields this agent emits actually exist.
    # Originally >=0.2, because 0.1.0 predates NodeRegistration.module_capable:
    # a volunteer on that wheel would register without the field, and the
    # coordinator's fail-open module gate happens to tolerate that, but
    # argv_capable's fail-closed gate does not.
    #
    # Raised to >=0.3,<0.4 for the first published release. 0.3.0 is the first
    # flashruntime that exists on PyPI at all, so any lower floor names
    # something a volunteer cannot install. The upper bound is deliberate: this
    # agent runs on machines we cannot reach, so it must never be silently
    # upgraded across a protocol-breaking runtime release.
    "flashruntime>=0.3,<0.4",
    "psutil>=5.9",
    "websockets>=12",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
flashnode = "flashnode.agent.cli:main"

[project.urls]
Homepage = "https://github.com/Zolli-Labs/flashnode"

[tool.setuptools.packages.find]
include = ["flashnode*"]

[tool.pytest.ini_options]
# Unit tests run everywhere with zero infrastructure. Integration tests
# (tests/integration/) need a real Docker daemon and are opt-in:
# pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: needs a real docker daemon; excluded by default, run with -m integration",
]
