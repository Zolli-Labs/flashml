# Build and publish the curated task images.
#
# These are the images volunteers' machines pull and run submitted code
# inside. A host never builds anything: it pulls a reference the cloud API
# named, which is the only reason "donate a machine" is a one-command setup
# rather than a Docker tutorial.
#
# THE TAG IS IMMUTABLE. Bump IMAGE_TAG for every change; never repush an
# existing one. Two things depend on that:
#   * `docker run` serves a locally cached image when the tag string is
#     unchanged, so a repushed tag reaches exactly the hosts that have never
#     pulled it and silently skips everyone else — the worst possible
#     distribution of "did this machine get the fix?".
#   * flashml-cloud's apps/api/flashml_cloud_api/images.py (PRIVATE repo)
#     pins these exact strings, and
#     preflight validates a user's imports against the manifest for THAT
#     version. A tag whose contents changed invalidates that guarantee.
# The `refuse to overwrite` step below enforces this rather than trusting
# anyone to have read this comment.
#
# WHY THIS WORKFLOW LIVES IN THE PUBLIC REPO (moved 2026-08-01).
#
# Not for visibility — that was a wrong guess, corrected here after testing
# it. GHCR container packages are created PRIVATE **always**, whatever the
# visibility of the repo that publishes them. Moving the build here did not
# change that, and a fresh publish from this public repo produced private
# packages exactly as before.
#
# The move is still right, for two reasons that do hold:
#   * flashnode is PUBLIC and trusts the `ghcr.io/zolli-labs/flashml-` prefix
#     by default. The people being asked to run these images on their own
#     laptops can now read the Dockerfiles that produced them, in the same
#     repo as the agent that pulls them.
#   * It is where new images belong as the set grows — JAX, transformers, a
#     GPU build — each a Dockerfile here, picked up by every host through the
#     existing prefix allowlist with no change on any machine.
#
# ===========================================================================
# MANUAL STEP, STILL REQUIRED, AFTER ANY *NEW* IMAGE IS PUBLISHED FIRST TIME:
#
#   github.com/orgs/Zolli-Labs/packages -> <package> -> Package settings
#     -> Danger Zone -> Change visibility -> Public
#
# GitHub exposes no REST endpoint for package visibility, so this cannot be
# automated from here. Until it is done, every volunteer's `docker pull`
# fails with a 401 that looks nothing like "this package is private", and the
# job dies on their machine after signup, install and enrolment all appeared
# to work.
#
# It is NOT left to memory: flashml-cloud's
# tests/test_images.py::test_every_curated_image_is_anonymously_pullable asks
# GHCR for an anonymous token for every reference the API can emit, and fails
# naming the ones a stranger cannot reach. Run it after publishing.
# ===========================================================================
name: curated images

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

env:
  # Must equal IMAGE_TAG in flashml-cloud's apps/api/flashml_cloud_api/
  # images.py. The two repos cannot import each other, so that agreement is
  # checked where it actually matters: flashml-cloud's test_images.py asserts
  # every reference the API can emit is ANONYMOUSLY pullable from GHCR. A tag
  # bumped here and not there fails that test, and so does an image that is
  # published but unreachable — which a string comparison between two files
  # could never catch, and did not.
  IMAGE_TAG: "2026.08.1"
  REGISTRY: ghcr.io
  NAMESPACE: zolli-labs

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Independent images: one failing must not cancel the others, or a
      # transient registry error looks like a broken Dockerfile.
      fail-fast: false
      matrix:
        # pytorch-cuda joined 2026-08-02. It needs no structural change here
        # — same build, same non-root check, same digest report — but it is
        # multi-gigabyte, so its matrix leg runs several times longer than the
        # other three. That is expected, not a hung job.
        alias: [python-slim, sklearn, pytorch-cpu, pytorch-cuda]

    steps:
      - uses: actions/checkout@v4

      - name: Make room for the CUDA image
        if: matrix.alias == 'pytorch-cuda'
        # A GitHub-hosted runner has ~14 GB free. pytorch-cuda needs that
        # twice over: buildkit's copy while building, then a real `docker
        # pull` in the verify steps below (build-push-action pushes straight
        # from buildkit, so the image is genuinely not in the local store
        # afterwards). Without this the leg dies with "no space left on
        # device" somewhere in the middle of a ten-minute build, which reads
        # like a broken Dockerfile and is not. The other three images are
        # small enough that this is a waste of a minute, hence the guard.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        run: |
          ref="${REGISTRY}/${NAMESPACE}/flashml-${{ matrix.alias }}:${IMAGE_TAG}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "::error::$ref already exists. Tags are immutable — bump"
            echo "::error::IMAGE_TAG in this workflow AND in images.py."
            exit 1
          fi
          echo "$ref is free"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.alias }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/flashml-${{ matrix.alias }}:${{ env.IMAGE_TAG }}
          # Attestation manifests confuse older Docker clients into pulling
          # the wrong platform entry. Volunteers run whatever Docker Desktop
          # they happen to have, so keep the manifest boring.
          provenance: false

      - name: Verify the published image runs as uid 10001
        # The whole point of these images. flashnode omits `--user` on
        # Windows (Docker Desktop cannot map host uids) and relies solely on
        # the image's declared USER; if that is root, every Windows volunteer
        # runs submitted code as container root. Asserting it on the PUSHED
        # image, not the built one, is deliberate — this is what a host gets.
        run: |
          ref="${REGISTRY}/${NAMESPACE}/flashml-${{ matrix.alias }}:${IMAGE_TAG}"
          docker pull "$ref"
          uid=$(docker run --rm --entrypoint id "$ref" -u)
          gid=$(docker run --rm --entrypoint id "$ref" -g)
          echo "uid=$uid gid=$gid"
          if [ "$uid" != "10001" ] || [ "$gid" != "10001" ]; then
            echo "::error::$ref runs as ${uid}:${gid}, expected 10001:10001"
            exit 1
          fi

      - name: Verify the declared packages are importable
        # images.py tells preflight what each image provides. If that set is
        # a lie, preflight either rejects code that would have run or accepts
        # code that crashes on a stranger's laptop 40 minutes in.
        run: |
          ref="${REGISTRY}/${NAMESPACE}/flashml-${{ matrix.alias }}:${IMAGE_TAG}"
          case "${{ matrix.alias }}" in
            python-slim)  mods="json os sys" ;;
            sklearn)      mods="numpy pandas sklearn scipy joblib threadpoolctl" ;;
            pytorch-cpu)  mods="torch numpy" ;;
            pytorch-cuda) mods="torch numpy" ;;
          esac
          for m in $mods; do
            docker run --rm "$ref" python -c "import $m" \
              || { echo "::error::$ref cannot import $m"; exit 1; }
          done
          echo "all declared packages import cleanly"

      - name: Verify the CUDA build is a CUDA build
        if: matrix.alias == 'pytorch-cuda'
        # `torch.cuda.is_available()` CANNOT be asserted here: GitHub-hosted
        # runners have no NVIDIA device, so it is False in this image no
        # matter how correct the image is. What IS checkable without a device
        # is that the wheel we installed is the cu124 one — the failure mode
        # --index-url exists to prevent is a silent fall back to a PyPI build
        # compiled against a different CUDA version, and that shows up in
        # torch.version.cuda long before any host sees it.
        #
        # The real proof — a job running on a device — is the rented-GPU
        # validation in the GPU plan's Task 11, and nothing here substitutes
        # for it.
        run: |
          ref="${REGISTRY}/${NAMESPACE}/flashml-${{ matrix.alias }}:${IMAGE_TAG}"
          cuda=$(docker run --rm "$ref" python -c "import torch; print(torch.version.cuda)")
          echo "torch.version.cuda=$cuda"
          case "$cuda" in
            12.4*) echo "cu124 build confirmed" ;;
            *) echo "::error::$ref carries a CUDA $cuda torch, expected 12.4"
               echo "::error::pip most likely resolved torch from PyPI —"
               echo "::error::check the --index-url in images/pytorch-cuda/Dockerfile."
               exit 1 ;;
          esac

      - name: Report the digest
        # Recorded so a later change can pin by digest instead of tag
        # (M1_DECISIONS.md D16 defers that to M2).
        run: |
          ref="${REGISTRY}/${NAMESPACE}/flashml-${{ matrix.alias }}:${IMAGE_TAG}"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$ref")
          echo "### \`${{ matrix.alias }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$digest\`" >> "$GITHUB_STEP_SUMMARY"
