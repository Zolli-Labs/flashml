name: ci

# Runs on every push and PR, for BOTH packages in this monorepo.
#
# GitHub only reads workflows from the repository ROOT. When flashruntime and
# flashnode were separate repos each carried its own .github/workflows/; after
# the merge those copies became inert — present, plausible, and never executed.
# This file is the live one. Do not re-add per-package workflow directories.
#
#   core-smoke      — `import flashruntime` stays pydantic-only (no heavy deps)
#   test            — the full flashruntime unit + e2e suite, every interpreter, both OSes
#   docs            — the docs site builds and every internal link resolves
#   bench-smoke     — the benchmark scenarios RUN (guards the harness, not numbers)
#   image-dockerfiles — every curated image declares a non-root USER
#   flashnode-test  — the agent suite, against flashruntime FROM THIS TREE
on:
  push:
    branches: ["**"]
  pull_request:

# One run per ref: a new push to the same branch/PR cancels the previous,
# still-running one. Saves CI minutes; the newest commit is the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-smoke:
    # The core promise (flashruntime/AGENTS.md): `import flashruntime` and the
    # planner / leases / checkpoint / recovery / viewer subpackages must work
    # with NOTHING but pydantic — never numpy, torch, k8s, minio, fastapi.
    # Install the bare package (no extras) and assert none of those leaked in.
    name: core-smoke (pydantic-only import)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flashruntime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          # Action inputs are resolved from the workspace root — `defaults.run`
          # applies to `run:` steps only, never to an action's own paths.
          cache-dependency-path: flashruntime/pyproject.toml
      - name: Install core only (no extras)
        run: pip install .
      - name: Assert the core import stays pydantic-only
        run: |
          python - <<'PY'
          import sys
          import flashruntime             # noqa: F401
          import flashruntime.viewer      # noqa: F401  (viewer is core: pure-python page/state)
          import flashruntime.planner     # noqa: F401
          import flashruntime.leases      # noqa: F401
          import flashruntime.checkpoint  # noqa: F401
          import flashruntime.recovery    # noqa: F401
          leaked = [m for m in ("numpy", "torch", "kubernetes", "minio", "fastapi")
                    if m in sys.modules]
          assert not leaked, f"heavy deps leaked into the core import: {leaked}"
          print("core import is pydantic-only OK")
          PY

  test:
    # The full unit + e2e suite across every supported interpreter and both
    # OSes. CPU torch + sklearn + service extras let the e2e examples (DDP on
    # CPU via torchrun, the sklearn sweep that spawns a bare `python`) run for
    # real instead of skipping. `pytest` deselects integration + bench_smoke by
    # default (see pyproject addopts), so this is the unit + e2e tier.
    name: test (py${{ matrix.python-version }} · ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: flashruntime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: flashruntime/pyproject.toml
      - name: Install CPU torch (runners have no CUDA)
        # --extra-index-url (NOT --index-url): --index-url would REPLACE PyPI, and the
        # torch cpu index commonly lacks macOS wheels. As an extra index PyPI stays the
        # resolver of last resort — macOS pulls its CPU wheel from PyPI; Linux prefers
        # the cpu index and so avoids the multi-GB CUDA payloads.
        run: pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Install flashruntime + test extras
        run: pip install -e ".[sklearn,dev,service]"
      - name: Run the suite (unit + e2e)
        # setup-python puts `python` and torch's `torchrun` console script on
        # PATH, so the e2e sklearn sweep (which spawns a bare `python`) and the
        # DDP examples resolve their interpreters. Do NOT override PATH here.
        run: pytest

  docs:
    # The docs site must build and every internal link + nav entry must
    # resolve. --check builds to a temp dir, writes nothing, and exits 1 with a
    # listing on any broken link. Needs only the dev extra (markdown + pyyaml).
    name: docs (build + link check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flashruntime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: flashruntime/pyproject.toml
      - name: Install docs build deps
        run: pip install -e ".[dev]"
      - name: Build + verify the docs site
        run: python scripts/build_docs.py --check

  bench-smoke:
    # Prove the benchmark scenarios RUN (1 repeat, explicitly non-
    # representative). This guards the measurement HARNESS — never a number.
    name: bench-smoke (scenarios run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flashruntime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: flashruntime/pyproject.toml
      - name: Install CPU torch
        run: pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Install flashruntime + bench-relevant extras
        run: pip install -e ".[sklearn,dev,service]"
      - name: Bench-marked unit tests
        run: pytest -m bench_smoke
      - name: Smoke-run every scenario (1 repeat, non-representative)
        run: python -m benchmarks run --all --repeats 1 --smoke

  image-dockerfiles:
    # The curated images must each declare a numeric non-root USER as their
    # last user-affecting instruction. flashnode omits `--user` on Windows
    # (Docker Desktop cannot map host uids) and relies solely on the image's
    # declared USER — so if that is root, every Windows volunteer runs
    # submitted code as container root.
    #
    # Parses the Dockerfiles directly: no daemon, no build, runs everywhere.
    # These tests moved here with the Dockerfiles from flashml-cloud, where
    # nothing at this repo root would otherwise have run them.
    name: image-dockerfiles (non-root USER)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Check every curated image runs as non-root
        run: pytest tests/ -q

  flashnode-test:
    # The agent suite, run against the flashruntime IN THIS TREE rather than a
    # published wheel. That is the point of keeping the two together: a protocol
    # change that breaks the agent fails here, in the same commit that made it,
    # instead of on a volunteer's laptop after the next release.
    #
    # Docker-marked tests are deselected by default (flashnode/pyproject.toml
    # addopts) — runners have a daemon, but the sandbox integration tier is
    # opt-in and slow. It stays a separate, deliberate run.
    name: flashnode-test (py${{ matrix.python-version }} · ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: flashnode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: flashnode/pyproject.toml
      - name: Install flashruntime from this tree, then flashnode
        # ../flashruntime, not PyPI: this job exists to catch cross-package
        # drift before a release, which a pinned wheel would hide.
        run: pip install -e ../flashruntime -e ".[dev]"
      - name: Run the agent suite
        run: pytest
