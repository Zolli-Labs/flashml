[build-system]
# setuptools>=77 accepts the PEP 639 SPDX `license` string form used below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flashruntime"
# 0.4.1 adds GpuInfo and ResourcesSpec.gpuPerTask. Both are additive wire
# fields, so the compatibility range does not move — but the PATCH bump is
# load-bearing, not bookkeeping. The `flashruntime-v0.4.0` tag was cut BEFORE
# the protocol commit that added them, and this tree went on calling itself
# 0.4.0 afterwards: one version string named two different protocols, which is
# exactly the drift the monorepo consolidation removed. Bump on any
# wire-visible change, even an additive one.
#
# flashnode’s floor moves to >=0.4.1,<0.5 in the same change — it imports
# GpuInfo at module scope, so for the agent this floor is an import-time hard
# requirement, not a silent-degradation one.
#
# 0.4.0 added NodeRegistration.local_datasets — a new wire field, so consumers
# must pin a range that includes it. (0.3.0 was the first published release;
# 0.1.0 and 0.2.0 were declared here but never reached PyPI.) Released from
# the Zolli-Labs/flashml monorepo by pushing a `flashruntime-vX.Y.Z` tag.
version = "0.4.1"
description = "Open fault-tolerant distributed ML runtime: strategy planning, job protocol, leases, checkpointing, and recovery across heterogeneous compute."
readme = "README.md"
# PEP 639 SPDX expression (string form) — replaces the deprecated
# `license = { text = ... }` table that setuptools now warns on. LICENSE ships
# in the wheel metadata via license-files.
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Zolli Labs" }]
keywords = [
    "machine-learning",
    "distributed-training",
    "fault-tolerance",
    "checkpointing",
    "pytorch",
    "ray",
    "mlops",
    "reliability",
    "hyperparameter-search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    # License is declared via the SPDX `license` expression above (PEP 639);
    # the legacy "License ::" classifier is disallowed alongside it.
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
# Core is deliberately tiny: the protocol, planner, leases, checkpoint
# catalog, and recovery policy need nothing but pydantic. Everything
# infrastructure-shaped (Ray/K8s backends, object stores, the HTTP service,
# the sklearn task-module examples) lives behind extras.
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
sklearn = ["numpy>=1.26", "scikit-learn>=1.3"]   # flashml_workloads/ task-module examples
k8s = ["kubernetes>=29"]
artifacts = ["minio>=7.2"]
oss = ["oss2>=2.18"]
monitor = ["psutil>=5.9"]                        # machine + process-tree telemetry for the run viewer
service = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "kubernetes>=29",
    "minio>=7.2",
    "pyyaml>=6",
]
dev = [
    "pytest",
    "pytest-asyncio>=0.23",
    "numpy>=1.26",
    "pyyaml>=6",
    "markdown>=3.6",   # scripts/build_docs.py — dev-time site builder, NOT a runtime dep
]

[project.scripts]
flashruntime = "flashruntime.service.cli:main"

[project.urls]
Homepage = "https://github.com/Zolli-Labs/flashruntime"
# Docs site goes live on the first GitHub Pages deploy (release.yml docs-deploy).
Documentation = "https://zolli-labs.github.io/flashruntime/"
Repository = "https://github.com/Zolli-Labs/flashruntime"
Issues = "https://github.com/Zolli-Labs/flashruntime/issues"
Changelog = "https://github.com/Zolli-Labs/flashruntime/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["flashruntime*", "flashml_workloads*"]

[tool.setuptools.package-data]
# py.typed marks the package PEP 561-typed (ships inline type info to users).
# viewer/_docs/** is the built docs site so the packaged viewer can serve /docs
# offline — build it (scripts/build_docs.py) BEFORE `python -m build`, or the
# wheel builds fine but ships docs-less (the release workflow does this in order
# and asserts the wheel contains viewer/_docs/index.html).
flashruntime = ["py.typed", "viewer/_docs/**"]

[tool.pytest.ini_options]
# Unit tests run everywhere with zero infrastructure. Integration tests
# (tests/integration/) need Docker / a Kubernetes cluster / MinIO and are
# opt-in: pytest -m integration
addopts = "-m 'not integration and not bench_smoke and not bench_stress'"
markers = [
    "integration: needs external infrastructure (docker, kubernetes, minio); excluded by default",
    "bench_smoke: benchmark scenario smoke tests (spawn subprocesses/torchrun; assert a scenario RUNS at 1 repeat, never a measured number); excluded by default, run with -m bench_smoke",
    "bench_stress: benchmark stress/chaos scenarios (long fault-injection loops, N=20; assert the loop RUNS and MEASURES a rate, never a baked number); excluded by default, run with -m bench_stress",
]
